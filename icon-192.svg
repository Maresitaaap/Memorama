<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo redondeado -->
  <rect x="12" y="12" width="168" height="168" rx="28" ry="28" fill="#D63384"/>

  <!-- Corazón con brillo -->
  <g transform="translate(96, 100)">
    <!-- Corazón principal -->
    <path d="M0,-20
             C-30,-40 -60,-20 -60,10
             C-60,35 -30,55 0,80
             C30,55 60,35 60,10
             C60,-20 30,-40 0,-20
             Z" fill="#F472B6"/>

    <!-- Brillo del corazón -->
    <path d="M-15,-10
             C-15,-20 0,-25 10,-15
             C15,-10 10,0 0,10
             C-10,0 -15,-10 -15,-10
             Z" fill="#FCE7F3" opacity="0.7"/>

    <!-- Estrella decorativa -->
    <polygon points="0,-45 3,-35 13,-35 5,-28 8,-18 0,-22 -8,-18 -5,-28 -13,-35 -3,-35" fill="#F9A8D4"/>

    <!-- Puntos brillantes -->
    <circle cx="-25" cy="-20" r="4" fill="#FCE7F3" opacity="0.9"/>
    <circle cx="25" cy="-20" r="3" fill="#FCE7F3" opacity="0.9"/>
    <circle cx="-30" cy="10" r="2" fill="#F9A8D4" opacity="0.8"/>
    <circle cx="30" cy="10" r="2" fill="#F9A8D4" opacity="0.8"/>
  </g>

  <!-- Brillo superior del fondo -->
  <ellipse cx="96" cy="45" rx="55" ry="18" fill="white" opacity="0.15"/>
</svg>
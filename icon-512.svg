<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo redondeado -->
  <rect x="32" y="32" width="448" height="448" rx="75" ry="75" fill="#D63384"/>

  <!-- Corazón con brillo -->
  <g transform="translate(256, 270)">
    <!-- Corazón principal -->
    <path d="M0,-55
             C-80,-105 -160,-55 -160,28
             C-160,95 -80,150 0,220
             C80,150 160,95 160,28
             C160,-55 80,-105 0,-55
             Z" fill="#F472B6"/>

    <!-- Brillo del corazón -->
    <path d="M-40,-28
             C-40,-55 0,-70 30,-40
             C45,-25 30,0 0,28
             C-30,0 -40,-28 -40,-28
             Z" fill="#FCE7F3" opacity="0.7"/>

    <!-- Estrella decorativa -->
    <polygon points="0,-120 8,-95 35,-95 14,-75 22,-50 0,-60 -22,-50 -14,-75 -35,-95 -8,-95" fill="#F9A8D4"/>

    <!-- Puntos brillantes -->
    <circle cx="-70" cy="-55" r="10" fill="#FCE7F3" opacity="0.9"/>
    <circle cx="70" cy="-55" r="8" fill="#FCE7F3" opacity="0.9"/>
    <circle cx="-85" cy="28" r="6" fill="#F9A8D4" opacity="0.8"/>
    <circle cx="85" cy="28" r="6" fill="#F9A8D4" opacity="0.8"/>
  </g>

  <!-- Brillo superior del fondo -->
  <ellipse cx="256" cy="120" rx="150" ry="48" fill="white" opacity="0.15"/>
</svg>